name: Check gate conditions
description: Evaluate whether workflow should run based on branch/PR and force labels

inputs:
  target:
    description: |
      Multiline list:
      - main
      - feature
      - task
    required: false
    default: ''

  force-labels:
    description: |
      Multiline list of labels which can force execution
    required: false
    default: ''

outputs:
  should-run:
    description: Final decision
    value: ${{ steps.evaluate.outputs.should-run }}

  target:
    description: JSON map of runs-for conditions
    value: ${{ steps.evaluate.outputs.target }}

  force-labels:
    description: JSON map of force label matches
    value: ${{ steps.evaluate.outputs.force-labels }}

runs:
  using: composite

  steps:
    - id: evaluate
      shell: bash
      env:
        RUNS_FOR: ${{ inputs.runs-for }}
        FORCE_LABELS: ${{ inputs.force-labels }}
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        BASE_REF: ${{ github.base_ref }}
        EVENT_PATH: ${{ github.event_path }}
      run: |
        node "${{ github.action_path }}/evaluate.js" >> "$GITHUB_OUTPUT"

    - shell: bash
      run: |
        echo "Gate results:"
        echo "  should-run: ${{ steps.evaluate.outputs.should-run }}"
        echo "  target: ${{ steps.evaluate.outputs.target }}"
        echo "  force-labels: ${{ steps.evaluate.outputs.force-labels }}"
