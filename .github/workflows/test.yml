name: test.yml

on:
  push:
    branches:
      - '**/*'
  pull_request:
    branches:
      - '**/*'

jobs:
  first: 
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Reads workflow metadata
        run: |
          meta=$(yq '.workflows["${{ github.workflow }}"]' ${{ github.workspace }}/.github/workflows-metadata.yml)
          echo "$meta"
