name: test.yml

on:
  push:
    branches:
      - '**/*'
  pull_request:
    branches:
      - '**/*'

jobs:
  first: 
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Reads workflow metadata
        id: metadata
        run: |
          file=${{ github.workspace }}/.github/workflows-metadata.yml
          root=.workflows["${{ github.workflow }}"]
          meta=$(yq "$root" $file)
          echo $meta
#          echo $meta | yq '.runs-on' -
#          runsOn=$(echo $meta | yq '.runs-on | join(",")' -)
#          echo "runs-on=$(echo $meta | yq '.runs-on' -)" >> $GITHUB_OUTPUT
#          echo "job-monitor-labels=$(echo $meta | yq '.job-monitor-labels' -)" >> $GITHUB_OUTPUT
#          echo "force-run-labels=$(echo $meta | yq '.force-run-labels' -)" >> $GITHUB_OUTPUT

      - name: Reads workflow metadata
        id: metadata2
        run: echo $meta | yq '.runs-on' -

      - name: Print metadata
        run: |
          echo "Workflow metadata:"
          echo "Runs on: ${{ steps.metadata.outputs.runs-on }}"
          echo "Job monitor labels: ${{ steps.metadata.outputs.job-monitor-labels }}"
          echo "Force run labels: ${{ steps.metadata.outputs.force-run-labels }}"
